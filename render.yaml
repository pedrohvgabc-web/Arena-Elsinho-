# Frontend no CDN gratuito do Render. O backend Node arena-elsinho segue
# inalterado e continua servindo a API pelos rewrites do novo host.
services:
  - type: web
    runtime: static
    name: arena-leste
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:static
    staticPublishPath: dist/client
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(self "https://www.google.com" "https://maps.google.com")'
      # Revalidar somente as entradas HTML; os assets com hash continuam aptos ao cache do CDN.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /admin*
        name: Cache-Control
        value: no-cache
      - path: /cancelamento*
        name: Cache-Control
        value: no-cache
      - path: /pagamento/*
        name: Cache-Control
        value: no-cache
      - path: /privacidade*
        name: Cache-Control
        value: no-cache
      - path: /reservar*
        name: Cache-Control
        value: no-cache
      - path: /termos*
        name: Cache-Control
        value: no-cache
      - path: /torneio*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arena-elsinho.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: arena-elsinho-static
    branch: main
    buildCommand: mkdir -p redirect-only && printf 'redirect-ready' > redirect-only/placeholder.txt
    staticPublishPath: redirect-only
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=(self "https://www.google.com" "https://maps.google.com")'
    routes:
      # Redirect permanente: mantém links antigos apontando ao site atual.
      - type: redirect
        source: /*
        destination: https://arena-leste.onrender.com/*
