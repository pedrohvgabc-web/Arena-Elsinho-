# Frontend SPA no CDN gratuito do Render; o Web Service arena-elsinho continua
# sendo o backend Node e não é renomeado nem removido.
services:
  - type: web
    runtime: static
    name: arena-elsinho-static
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:static
    staticPublishPath: dist/client
    routes:
      # Manter funções TanStack e rotas de servidor no backend, incluindo webhooks.
      - type: rewrite
        source: /api/*
        destination: https://arena-elsinho.onrender.com/api/*
      # Qualquer rota de frontend usa o shell estático servido pelo CDN.
      - type: rewrite
        source: /*
        destination: /index.html
